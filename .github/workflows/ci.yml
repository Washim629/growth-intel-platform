name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check app --select=E9,F63,F7,F82 --exit-zero

      - name: Type/syntax check
        run: python -m py_compile $(find app -name "*.py")

      - name: Run tests
        env:
          DATABASE_URL: sqlite:///./ci_test.db
          JWT_SECRET_KEY: ci-test-secret
          OPENAI_API_KEY: ""
        run: pytest -q

      - name: Generate sample data (smoke test)
        run: python scripts/generate_sample_data.py --rows 200 --out /tmp/sample.csv

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax-check frontend JS
        run: |
          node --check frontend/assets/app.js
          node --check frontend/assets/api.js
